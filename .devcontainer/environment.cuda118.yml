name: pyt-eqa-fge
channels:
  - conda-forge
  - defaults
dependencies:
  # outlines requires Python <3.14
  - python=3.11
  - pip
  - ipykernel
  - pip:
      # CUDA 11.8 for compatibility with older host GPU drivers (e.g. Ubuntu 18.04).
      # torch is pinned to 2.6.0+cu118 because it is the newest cu118 wheel for Python 3.11.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.6.0+cu118
      - transformers
      - accelerate
      - bitsandbytes
      - datasets
      - huggingface_hub
      - pydantic
      - outlines[transformers]==1.3.3
      # Used by scripts/build_dataset_local_gpu.py to load .env
      - python-dotenv
