name: pyt-eqa-fge
channels:
  - conda-forge
  - defaults
dependencies:
  # outlines requires Python <3.14
  - python=3.11
  - pip
  - ipykernel
  - pip:
      # adjust cu124 to match the GPU driver's CUDA version (check `nvidia-smi`)
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch
      - transformers
      - accelerate
      - bitsandbytes
      - datasets
      - huggingface_hub
      - evaluate
      - pydantic
      - python-dotenv
      - outlines[transformers]==1.3.3
      - tqdm
      - matplotlib
      - seaborn
      # Required by slow-tokenizer conversion (e.g. deepset/xlm-roberta-base-squad2
      # SentencePiece -> tokenizers). Missing protobuf/tiktoken breaks
      # AutoTokenizer.from_pretrained with an ImportError.
      - protobuf
      - tiktoken
      - sentencepiece
